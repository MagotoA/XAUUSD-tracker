<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold signal tracker</title>
<style>
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #17202B; --muted: #5B6675; --rule: #DCE1E7; --rule-strong: #C4CBD4;
  --gold: #946A05; --gold-strong: #7A5703; --gold-soft: #F4E8C8; --win: #2B7A4B; --loss: #B23F2C; --loss-soft: #F6DFDA;
  --chip: #EEF1F4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F141B; --surface: #161E28; --ink: #E7EBF0; --muted: #98A4B3; --rule: #273241; --rule-strong: #364354;
    --gold: #E1B54D; --gold-strong: #F0C865; --gold-soft: #352C1A; --win: #5CC089; --loss: #E8806C; --loss-soft: #3A2320;
    --chip: #1D2733;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
main { max-width: 1160px; margin: 0 auto; padding: 0 20px 72px; }
h1 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-weight: 700;
     font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: -0.015em; }
h1 .mark { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--gold);
     margin-right: 10px; vertical-align: 0.12em; box-shadow: 0 0 0 4px var(--gold-soft); }
h2 { font-size: 17px; font-weight: 650; margin: 0; }
h3 { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
p { margin: 0; }
.note { color: var(--muted); font-size: 13px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
button.link { background: none; border: 0; padding: 0; color: var(--gold); cursor: pointer; text-decoration: underline; }

/* Top bar and navigation */
header.top { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; justify-content: space-between; padding: 28px 0 14px; }
.asof { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 72ch; }
.controls { display: flex; gap: 18px; align-items: center; }
label.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; color: var(--muted); font-size: 14px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--gold); margin: 0; }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule);
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { background: none; border: 0; padding: 12px 14px 11px; cursor: pointer; white-space: nowrap;
  color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); }
nav.tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px;
  background: var(--gold-soft); color: var(--gold-strong); font-size: 12px; text-align: center; }

/* Layout pieces */
.view { padding-top: 24px; }
.scope { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 18px; }
.scope .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
section.block { margin-top: 32px; }
.block-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 32px 40px; }
.grid2 { margin-top: 32px; }
.grid2 > section.block { margin-top: 0; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
.empty { color: var(--muted); padding: 14px 0; }

/* KPI strip: one ruled row, not a card per number */
dl.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); margin: 0;
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); }
dl.kpis > div { padding: 14px 16px 14px 0; }
dl.kpis > div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
dl.kpis dt { color: var(--muted); font-size: 13px; }
dl.kpis dd { margin: 2px 0 0; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
dd.pos { color: var(--win); } dd.neg { color: var(--loss); }
@media (max-width: 640px) {
  dl.kpis { grid-template-columns: repeat(2, 1fr); }
  dl.kpis > div { padding: 12px 0 12px 0; border-left: 0 !important; padding-left: 0 !important; border-top: 1px solid var(--rule); }
  dl.kpis > div:nth-child(-n+2) { border-top: 0; }
  dl.kpis > div:nth-child(even) { padding-left: 14px !important; border-left: 1px solid var(--rule) !important; }
}

/* Leaderboard: the signature element. Total R per channel, a bar either side of zero. */
ol.board { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); counter-reset: rank; }
ol.board > li { border-bottom: 1px solid var(--rule); }
ol.board button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; gap: 4px 20px; padding: 13px 8px;
  grid-template-columns: 28px minmax(210px, 1.5fr) minmax(220px, 1.7fr) minmax(110px, 0.9fr) 92px; align-items: center; }
ul.notes { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.45; }
ul.notes li + li { margin-top: 3px; }
ul.notes li::marker { color: var(--gold); }
.board-head { display: grid; grid-template-columns: 28px minmax(210px, 1.5fr) minmax(220px, 1.7fr) minmax(110px, 0.9fr) 92px;
  gap: 4px 20px; padding: 0 8px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.board-head span:last-child { text-align: right; }
ul.notes.wide { font-size: 14px; }
@media (max-width: 900px) {
  ol.board button { grid-template-columns: 28px 1fr 92px; }
  ol.board .notes { grid-column: 2 / 4; grid-row: 2; }
  ol.board .dbar { grid-column: 2 / 4; grid-row: 3; }
  .board-head { display: none; }
}
ol.board button:hover { background: var(--surface); }
ol.board button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.rank { color: var(--muted); font-size: 13px; text-align: right; }
.name { font-weight: 650; overflow-wrap: anywhere; }
.facts { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600;
  background: var(--loss-soft); color: var(--loss); vertical-align: 1px; }
.dbar { position: relative; height: 14px; }
.dbar::before { content: ""; position: absolute; left: 50%; top: -5px; bottom: -5px; border-left: 1px solid var(--muted); opacity: .45; }
.dbar span { position: absolute; top: 0; height: 100%; border-radius: 2px; }
.dbar .pos { left: 50%; background: var(--gold); } .dbar .neg { right: 50%; background: var(--loss); }
.big { text-align: right; font-weight: 700; font-size: 17px; }
.big small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.big.pos { color: var(--gold); } .big.neg { color: var(--loss); }
@media (max-width: 640px) {
  ol.board button { grid-template-columns: 22px 1fr 78px; }
  ol.board .notes { grid-column: 2 / 4; grid-row: 2; }
  ol.board .dbar { grid-column: 2 / 4; grid-row: 3; }
}

/* Bars (HTML) */
.bars { display: grid; gap: 8px; }
.bars .row { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 76px; gap: 10px; align-items: center; font-size: 14px; }
.bars .lab { overflow-wrap: anywhere; } .bars .lab small { color: var(--muted); display: block; font-size: 12px; }
.bars .track { position: relative; height: 12px; background: var(--chip); border-radius: 3px; }
.bars .track.div::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--muted); opacity: .5; }
.bars .fill { position: absolute; top: 0; height: 100%; border-radius: 3px; background: var(--gold); }
.bars .fill.neg { background: var(--loss); }
.bars .val { text-align: right; font-weight: 600; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.chart { min-height: 40px; }
svg .grid { stroke: var(--rule); stroke-width: 1; }
svg .zero { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }

/* Tables */
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 13px; background: var(--surface); }
th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--ink); }
th[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--chip); }
td.wrap { white-space: normal; min-width: 220px; }
td.flag { color: var(--loss); font-size: 13px; }
.buy { color: var(--win); font-weight: 600; } .sell { color: var(--loss); font-weight: 600; }
.win { color: var(--win); } .loss { color: var(--loss); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
select, input[type=search] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 6px; padding: 6px 10px; }
input[type=search] { min-width: 220px; }
input[type=date] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 8px; }
label.datef { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
button.action { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.action:hover { border-color: var(--gold); }
.back { margin-bottom: 10px; display: inline-block; }

/* Unlock screen (website) */
body.locked main > :not(#unlock):not(#loading) { display: none; }
#loading { max-width: 420px; margin: 14vh auto 0; }
#loading p { color: var(--muted); margin-top: 8px; }
#unlock { max-width: 420px; margin: 14vh auto 0; }
#unlock p { color: var(--muted); margin-top: 8px; }
#unlock input[type=password] { display: block; width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 6px; padding: 10px 12px; margin: 16px 0 12px; }
#unlock button[type=submit] { font-weight: 600; color: var(--surface); background: var(--gold); border: 0;
  border-radius: 6px; padding: 10px 18px; margin-top: 16px; cursor: pointer; }
#unlock .error { color: var(--loss); min-height: 1.5em; }
@media (prefers-reduced-motion: no-preference) { ol.board li button, nav.tabs button { transition: background .15s, color .15s; } }
</style>
</head>
<body class="locked">
<main>
  <div id="loading" hidden>
    <h1><span class="mark" aria-hidden="true"></span>Gold signal tracker</h1>
    <p>Opening the dashboard… this can take a few seconds on a phone.</p>
  </div>
  <form id="unlock" hidden>
    <h1><span class="mark" aria-hidden="true"></span>Gold signal tracker</h1>
    <p>Enter your password to open the dashboard.</p>
    <label for="pw" class="note">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="toggle"><input type="checkbox" id="remember"> Remember on this device</label>
    <br><button type="submit" id="open">Open dashboard</button>
    <p class="error" id="unlock-error" role="alert"></p>
  </form>
  <header class="top">
    <div>
      <h1><span class="mark" aria-hidden="true"></span>Gold signal tracker</h1>
      <p class="asof" id="asof"></p>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="bf"> Include backfill</label>
      <button class="link" id="older" hidden></button>
      <button class="link" id="lock" hidden>Lock</button>
    </div>
  </header>
  <nav class="tabs" id="nav" aria-label="Dashboard sections"></nav>
  <div class="view" id="view"></div>
</main>

<script>
(function () {
  "use strict";
  var DATA = { trades: [], legs: [] }, LEGS = [], SIGS = [], CLEGS = [], CSIGS = [], NOTE = "";
  var VIEWS = [["overview", "Overview"], ["channels", "Channels"], ["live", "Live"], ["consensus", "Consensus"], ["account", "Live account"], ["best3", "Best of 3"], ["analytics", "Analytics"], ["history", "History"]];
  var OUTCOMES = ["TP hit", "Stop loss", "Trailing stop", "Breakeven stop", "Closed by channel", "Timed out", "Open", "Waiting for entry", "Not filled", "Invalid"];

  // ---------- state in the address (#v=channels&c=…), so it survives the automatic refresh ----------
  function readState() {
    var p = new URLSearchParams(location.hash.slice(1));
    return { v: p.get("v") || "overview", c: p.get("c") || "", bf: p.get("bf") === "1", q: p.get("q") || "",
             s: p.get("s") || "totalR", d: p.get("d") !== "0", hc: p.get("hc") || "", ho: p.get("ho") || "", hs: p.get("hs") || "",
             hf: p.get("hf") || "", ht: p.get("ht") || "", hb: p.get("hb") || "posted", om: parseInt(p.get("om") || "0", 10) || 0, la: parseInt(p.get("la") || "0", 10) || 0 };
  }
  var state = readState();
  function save() {
    var p = new URLSearchParams();
    if (state.v !== "overview") p.set("v", state.v);
    if (state.c) p.set("c", state.c);
    if (state.bf) p.set("bf", "1");
    if (state.q) p.set("q", state.q);
    if (state.s !== "totalR") p.set("s", state.s);
    if (!state.d) p.set("d", "0");
    ["hc", "ho", "hs", "hf", "ht"].forEach(function (k) { if (state[k]) p.set(k, state[k]); });
    if (state.hb !== "posted") p.set("hb", state.hb);
    if (state.om) p.set("om", String(state.om));
    if (state.la) p.set("la", String(state.la));
    history.replaceState(null, "", "#" + p.toString());
  }
  function go(changes, keepScroll) { Object.assign(state, changes); save(); render(); if (!keepScroll) window.scrollTo(0, 0); }

  // ---------- small helpers ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "cls") n.className = attrs[k];
      else if (k === "on") Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
      else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c); });
    return n;
  }
  var NS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, text) {
    var n = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function when(iso) { return iso ? new Date(iso).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""; }
  function dateOnly(iso) { return iso ? new Date(iso).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" }) : ""; }
  function timeOnly(iso) { return iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""; }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function ymd(iso) { if (!iso) return ""; var d = new Date(iso); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function hm(iso) { if (!iso) return ""; var d = new Date(iso); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function day(ms) { return new Date(ms).toLocaleDateString([], { day: "numeric", month: "short" }); }
  function dur(min) {
    if (min == null) return "";
    min = Math.max(0, Math.round(min));
    var d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
    return (d ? d + "d " : "") + (h || d ? h + "h " : "") + m + "m";
  }
  function fmt(x, d) { return x == null || isNaN(x) ? "–" : Number(x).toFixed(d == null ? 1 : d); }
  function signed(x, d) { return x == null || isNaN(x) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d == null ? 1 : d); }
  function pct(a, b) { return b ? Math.round(a / b * 100) + "%" : "–"; }
  function sum(a) { return a.reduce(function (s, x) { return s + (x || 0); }, 0); }
  function median(a) { if (!a.length) return null; var b = a.slice().sort(function (x, y) { return x - y; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }
  function byExit(a, b) { return (a.exit_at || "") < (b.exit_at || "") ? -1 : (a.exit_at || "") > (b.exit_at || "") ? 1 : 0; }
  function cls(x) { return x > 0 ? "pos" : x < 0 ? "neg" : ""; }
  function empty(text) { return el("p", { cls: "empty", text: text }); }
  function block(title, note, body, extra) {
    return el("section", { cls: "block" }, [el("div", { cls: "block-head" }, [el("h2", { text: title }), note ? el("p", { cls: "note", text: note }) : null, extra || null]), body]);
  }
  function sideCell(t) { return el("span", { cls: t.side, text: t.side === "buy" ? "Buy" : "Sell" }); }
  function rCell(r) { return r == null ? "" : el("span", { cls: r > 0 ? "win" : r < 0 ? "loss" : "", text: signed(r, 2) }); }
  function outcomeGroup(t) {
    if (t.status === "closed") return { tp: "TP hit", sl: "Stop loss", breakeven: "Breakeven stop", manual: "Closed by channel", timeout: "Timed out", trail: "Trailing stop" }[t.exit_reason] || "Closed";
    if (t.status === "open") return "Open";
    if (t.status === "pending") return "Waiting for entry";
    if (t.status === "not_filled") return "Not filled";
    return "Invalid";
  }

  // ---------- data ----------
  function pool() { return LEGS.filter(function (t) { return state.bf || t.source !== "backfill"; }); }
  function sigPool() { return SIGS.filter(function (t) { return state.bf || t.source !== "backfill"; }); }
  function isIncomplete(t) { return t.incomplete || t.status === "incomplete"; }
  function isScored(t) { return !isIncomplete(t) && t.status !== "superseded"; }
  function distinct(rows) { return new Set(rows.map(function (t) { return t.trade_id || t.id; })).size; }
  function channels() { return Array.from(new Set(LEGS.map(function (t) { return t.grp; }))).sort(); }

  function metrics(rows) {
    var sc = rows.filter(isScored);
    var closed = sc.filter(function (t) { return t.status === "closed"; }).sort(byExit);
    var rs = closed.map(function (t) { return t.r_multiple; }).filter(function (r) { return r != null; });
    var cum = 0, peak = 0, dd = 0, run = 0, worst = 0;
    closed.forEach(function (t) {
      cum += t.r_multiple || 0; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum);
      if (t.result === "loss") { run++; worst = Math.max(worst, run); } else if (t.result === "win") run = 0;
    });
    var gw = sum(rs.filter(function (r) { return r > 0; })), gl = -sum(rs.filter(function (r) { return r < 0; }));
    var tp = [];
    for (var i = 1; i <= 6; i++) {
      var at = closed.filter(function (t) { return t.leg === i && t.tp != null; });
      if (at.length) tp.push({ n: i, hit: at.filter(function (t) { return t.exit_reason === "tp"; }).length, of: at.length });
    }
    var mins = closed.map(function (t) { return t.minutes_in_trade; }).filter(function (m) { return m != null; });
    var waited = sc.filter(function (t) { return t.status === "not_filled" || t.status === "closed" || t.status === "open"; });
    return {
      signals: distinct(sc), positions: sc.length, closed: closed.length,
      wins: closed.filter(function (t) { return t.result === "win"; }).length,
      losses: closed.filter(function (t) { return t.result === "loss"; }).length,
      totalR: sum(rs), avgR: rs.length ? sum(rs) / rs.length : null, pips: sum(closed.map(function (t) { return t.pnl_pips; })),
      pf: gl ? gw / gl : (gw ? Infinity : null), maxDD: dd, streak: worst, tp: tp,
      avgMin: mins.length ? sum(mins) / mins.length : null,
      notFilled: sc.filter(function (t) { return t.status === "not_filled"; }).length, waited: waited.length,
      invalid: distinct(sc.filter(function (t) { return t.status === "invalid"; })),
      incomplete: distinct(rows.filter(isIncomplete)),
      flags: distinct(sc.filter(function (t) { return t.flag_count > 0; })),
      open: sc.filter(function (t) { return t.status === "open"; }).length,
      pending: sc.filter(function (t) { return t.status === "pending"; }).length,
      gross: sum(closed.map(function (t) { return t.r_gross; })), costPips: sum(closed.map(function (t) { return t.cost_pips; }))
    };
  }
  function pfText(pf) { return pf == null ? "–" : pf === Infinity ? "∞" : fmt(pf, 2); }

  // ---------- charts ----------
  var POST = [];
  // Charts are drawn after the view is on the page, at its real width, so text stays readable.
  function chart(draw) {
    var box = el("div", { cls: "chart" });
    POST.push(function () { box.appendChild(draw(Math.max(260, Math.floor(box.clientWidth)))); });
    return box;
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  function expand(d) {   // the export leaves out empty fields and the fields a position shares with its signal
    if (!d || d.format !== 2) return d;
    var tk = d.trade_keys || [], lk = {}, by = {};
    (d.leg_keys || []).forEach(function (k) { lk[k] = 1; });
    (d.trades || []).forEach(function (t) { tk.forEach(function (k) { if (!(k in t)) t[k] = null; }); by[t.id] = t; });
    (d.legs || []).forEach(function (l) {
      var t = by[l.trade_id] || {};
      SHARED.forEach(function (k) { if (!(k in l) && lk[k]) l[k] = k in t ? t[k] : null; });
      Object.keys(lk).forEach(function (k) { if (!(k in l)) l[k] = null; });
    });
    d.format = 1;
    return d;
  }
  function monthName(m) { var p = m.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, 15)).toLocaleDateString([], { month: "short", year: "numeric" }); }
  function months() { return (DATA.archive || []).map(function (a) { return a.month; }).sort().reverse(); }   // newest first
  function nextMonth() { return months().filter(function (m) { return !MERGED[m]; })[0] || null; }
  function merged() { return Object.keys(MERGED).length; }
  function windowNote() {
    if (!DATA.window_from) return "";
    var older = merged() ? " plus " + merged() + " older month" + (merged() > 1 ? "s" : "") : "";
    return "Showing signals from " + dateOnly(DATA.window_from) + " (last " + DATA.window_days + " days)" + older + ". ";
  }
  function olderButton() {
    var b = document.getElementById("older"), m = nextMonth();
    b.hidden = !m || !LOADER;
    if (b.hidden) return;
    b.disabled = !!LOADING;
    b.textContent = LOADING ? "Loading " + monthName(LOADING) + "…" : FAILED ? "Couldn't load " + monthName(m) + ". Try again" : "Load older months (" + monthName(m) + ")";
  }
  function split() {
    var sigs = DATA.trades || [], legs = DATA.legs || sigs;
    SIGS = sigs.filter(function (t) { return !t.consensus; }); CSIGS = sigs.filter(function (t) { return t.consensus; });
    LEGS = legs.filter(function (t) { return !t.consensus; }); CLEGS = legs.filter(function (t) { return t.consensus; });
  }
  function merge(m) {   // add an archive month; anything already on the page wins
    var a = CACHE[m], ti = {}, li = {};
    (DATA.trades || []).forEach(function (t) { ti[t.id] = 1; });
    (DATA.legs || []).forEach(function (l) { li[l.id] = 1; });
    a.trades.forEach(function (t) { if (!ti[t.id]) DATA.trades.push(t); });
    a.legs.forEach(function (l) { if (!li[l.id]) DATA.legs.push(l); });
    MERGED[m] = 1;
  }
  function fresh(m) {   // a cached month still matches what the tracker last exported
    var a = CACHE[m], e = (DATA.archive || []).filter(function (x) { return x.month === m; })[0];
    return a && e && a.trades.length === e.trades && a.legs.length === e.positions;
  }
  function loadMore() {   // load months until state.om of them are on the page
    while (merged() < state.om) {
      var m = nextMonth();
      if (!m) { state.om = merged(); save(); break; }
      if (fresh(m)) { merge(m); continue; }
      if (!LOADER) break;
      LOADING = m; FAILED = "";
      LOADER(m);
      olderButton();
      return;
    }
    split(); render();
  }
  function render() {
    renderHeader();
    var v = document.getElementById("view");
    v.textContent = "";
    POST = [];
    ({ overview: viewOverview, consensus: viewConsensus, channels: viewChannels, live: viewLive, account: viewAccount, best3: viewBest3, analytics: viewAnalytics, history: viewHistory }[state.v] || viewOverview)(v);
    POST.forEach(function (f) { f(); });
  }
  var lastW = window.innerWidth, resizeT = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; render(); } }, 250);
  });
  document.getElementById("bf").addEventListener("change", function (e) { go({ bf: e.target.checked }); });
  document.getElementById("older").addEventListener("click", function () {
    if (LOADING || !nextMonth()) return;
    state.om = merged() + 1; save(); loadMore();
  });
  window.addEventListener("hashchange", function () { state = readState(); render(); });

  window.GST = {
    start: function (d, note) {
      DATA = expand(d || {}); DATA.trades = DATA.trades || []; DATA.legs = DATA.legs || [];
      MERGED = {}; LOADING = null; FAILED = "";
      NOTE = note || ""; split(); render();
      if (state.om) loadMore();
    },
    setLoader: function (f) { LOADER = f; olderButton(); },
    addMonth: function (a) {   // called with one archive month (export/archive/<month>.js, or the website's copy)
      if (!a || !a.month) return;
      CACHE[a.month] = expand(a);
      if (LOADING === a.month) LOADING = null;
      if (!MERGED[a.month]) merge(a.month);
      loadMore();
    },
    loadFailed: function (m, msg) {
      if (LOADING === m) LOADING = null;
      FAILED = msg || "failed"; state.om = merged(); save(); split(); render();
    }
  };
})();
</script>
<script>
(function () {
  "use strict";
  var SRC = "https://raw.githubusercontent.com/MagotoA/XAUUSD-tracker/data/data.json", EVERY_MIN = 3, KEY = "gst-password";
  var form = document.getElementById("unlock"), pw = document.getElementById("pw"),
      remember = document.getElementById("remember"), err = document.getElementById("unlock-error"),
      lockBtn = document.getElementById("lock"), loading = document.getElementById("loading");
  var cache = {}, password = null, lastStamp = null;

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function store(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }

  async function key(pass, salt, iter) {
    if (cache.pass === pass && cache.salt === salt) return cache.key;
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(salt), iterations: iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    cache = { pass: pass, salt: salt, key: k };
    return k;
  }
  async function load(pass, src) {
    var ctl = window.AbortController ? new AbortController() : null, r;
    var timer = ctl && setTimeout(function () { ctl.abort(); }, 60000);
    try { r = await fetch((src || SRC) + "?t=" + Date.now(), { cache: "no-store", signal: ctl ? ctl.signal : undefined }); }
    catch (e) { throw { kind: "fetch", msg: "The data couldn't be downloaded (no connection, or it took over a minute). Try again." }; }
    finally { if (timer) clearTimeout(timer); }
    if (!r.ok) throw { kind: "fetch", msg: "The data file couldn't be downloaded (HTTP " + r.status + "). The tracker may not have published yet." };
    var blob = await r.json(), plain;
    try {
      plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, await key(pass, blob.salt, blob.iter), b64(blob.ct));
    } catch (e) { throw { kind: "password", msg: "That password doesn't open this dashboard." }; }
    var text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(text);
  }
  function show(data) {
    document.body.classList.remove("locked"); form.hidden = true; loading.hidden = true; lockBtn.hidden = false;
    if (data.generated_at === lastStamp) return;
    lastStamp = data.generated_at;
    GST.start(data, "This page checks for new data every " + EVERY_MIN + " minutes; updates can take about 5 minutes to appear.");
  }
  function locked(message) {
    document.body.classList.add("locked"); form.hidden = false; loading.hidden = true; lockBtn.hidden = true;
    err.textContent = message || ""; pw.focus();
  }
  async function open(pass, fromForm) {
    try {
      var data = await load(pass);
      password = pass;
      if (fromForm) store(remember.checked ? pass : null);
      show(data);
    } catch (e) {
      if (e && e.kind === "password") { store(null); locked(fromForm ? e.msg : ""); }
      else locked((e && e.msg) || "Something went wrong opening the dashboard. Try again in a minute.");
    }
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); err.textContent = "Opening…"; open(pw.value, true); });
  lockBtn.addEventListener("click", function () { store(null); password = null; cache = {}; lastStamp = null; pw.value = ""; locked(""); });
  setInterval(function () { var a = document.activeElement; if (password && (!a || !/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) open(password, false); }, EVERY_MIN * 60000);

  GST.setLoader(function (m) {   // older months: archive/<month>.json next to data.json, encrypted the same way
    load(password, SRC.replace(/data\.json$/, "archive/" + m + ".json"))
      .then(function (a) { GST.addMonth(a); })
      .catch(function (e) { GST.loadFailed(m, (e && e.msg) || "failed"); });
  });
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    locked("This browser is too old to open the dashboard. Use a recent Chrome, Edge, Safari or Firefox.");
  } else if (stored()) { document.body.classList.add("locked"); loading.hidden = false; open(stored(), false); }
  else locked("");
})();
</script>
