<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold signal tracker</title>
<style>
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #17202B; --muted: #5B6675; --rule: #DCE1E7; --rule-strong: #C4CBD4;
  --gold: #946A05; --gold-strong: #7A5703; --gold-soft: #F4E8C8; --win: #2B7A4B; --loss: #B23F2C; --loss-soft: #F6DFDA;
  --chip: #EEF1F4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F141B; --surface: #161E28; --ink: #E7EBF0; --muted: #98A4B3; --rule: #273241; --rule-strong: #364354;
    --gold: #E1B54D; --gold-strong: #F0C865; --gold-soft: #352C1A; --win: #5CC089; --loss: #E8806C; --loss-soft: #3A2320;
    --chip: #1D2733;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
main { max-width: 1160px; margin: 0 auto; padding: 0 20px 72px; }
h1 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-weight: 700;
     font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: -0.015em; }
h1 .mark { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--gold);
     margin-right: 10px; vertical-align: 0.12em; box-shadow: 0 0 0 4px var(--gold-soft); }
h2 { font-size: 17px; font-weight: 650; margin: 0; }
h3 { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
p { margin: 0; }
.note { color: var(--muted); font-size: 13px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
button.link { background: none; border: 0; padding: 0; color: var(--gold); cursor: pointer; text-decoration: underline; }

/* Top bar and navigation */
header.top { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; justify-content: space-between; padding: 28px 0 14px; }
.asof { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 72ch; }
.controls { display: flex; gap: 18px; align-items: center; }
label.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; color: var(--muted); font-size: 14px; }
label.toggle.off { opacity: .45; cursor: default; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--gold); margin: 0; }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule);
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { background: none; border: 0; padding: 12px 14px 11px; cursor: pointer; white-space: nowrap;
  color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); }
nav.tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px;
  background: var(--gold-soft); color: var(--gold-strong); font-size: 12px; text-align: center; }

/* Layout pieces */
.view { padding-top: 24px; }
.scope { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 18px; }
.scope .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
section.block { margin-top: 32px; }
/* collapse / expand: the arrow in each section's title */
.fold { all: unset; cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px; }
.fold:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 4px; }
.fold .arrow { display: inline-block; width: 1em; font-size: .75em; color: var(--muted); }
section.block.folded .fold .arrow { transform: rotate(-90deg); }
section.block.folded > :not(.block-head), section.block.folded .block-head > :not(h2) { display: none; }
section.block.folded .block-head { margin-bottom: 0; }
.foldbar { display: flex; gap: 16px; justify-content: flex-end; font-size: 13px; margin-bottom: -12px; }
@media (prefers-reduced-motion: no-preference) { .fold .arrow { transition: transform .15s; } }
.block-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 32px 40px; }
.grid2 { margin-top: 32px; }
.grid2 > section.block { margin-top: 0; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
.empty { color: var(--muted); padding: 14px 0; }

/* KPI strip: one ruled row, not a card per number */
dl.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); margin: 0;
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); }
dl.kpis > div { padding: 14px 16px 14px 0; }
dl.kpis > div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
dl.kpis dt { color: var(--muted); font-size: 13px; }
dl.kpis dd { margin: 2px 0 0; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
dd.pos { color: var(--win); } dd.neg { color: var(--loss); }
@media (max-width: 640px) {
  dl.kpis { grid-template-columns: repeat(2, 1fr); }
  dl.kpis > div { padding: 12px 0 12px 0; border-left: 0 !important; padding-left: 0 !important; border-top: 1px solid var(--rule); }
  dl.kpis > div:nth-child(-n+2) { border-top: 0; }
  dl.kpis > div:nth-child(even) { padding-left: 14px !important; border-left: 1px solid var(--rule) !important; }
}

/* Leaderboard: the signature element. Total R per channel, a bar either side of zero. */
ol.board { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); counter-reset: rank; }
ol.board > li { border-bottom: 1px solid var(--rule); }
ol.board button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; gap: 4px 20px; padding: 13px 8px;
  grid-template-columns: 28px minmax(210px, 1.5fr) minmax(220px, 1.7fr) minmax(110px, 0.9fr) 92px; align-items: center; }
ul.notes { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.45; }
ul.notes li + li { margin-top: 3px; }
ul.notes li::marker { color: var(--gold); }
.board-head { display: grid; grid-template-columns: 28px minmax(210px, 1.5fr) minmax(220px, 1.7fr) minmax(110px, 0.9fr) 92px;
  gap: 4px 20px; padding: 0 8px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.board-head span:last-child { text-align: right; }
ul.notes.wide { font-size: 14px; }
@media (max-width: 900px) {
  ol.board button { grid-template-columns: 28px 1fr 92px; }
  ol.board .notes { grid-column: 2 / 4; grid-row: 2; }
  ol.board .dbar { grid-column: 2 / 4; grid-row: 3; }
  .board-head { display: none; }
}
ol.board button:hover { background: var(--surface); }
ol.board button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.rank { color: var(--muted); font-size: 13px; text-align: right; }
.name { font-weight: 650; overflow-wrap: anywhere; }
.facts { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600;
  background: var(--loss-soft); color: var(--loss); vertical-align: 1px; }
.badge.new { background: var(--gold-soft); color: var(--gold-strong); }
.badge.folder { background: var(--chip); color: var(--muted); }
.badge.paused { background: var(--chip); color: var(--loss); }
.dbar { position: relative; height: 14px; }
.dbar::before { content: ""; position: absolute; left: 50%; top: -5px; bottom: -5px; border-left: 1px solid var(--muted); opacity: .45; }
.dbar span { position: absolute; top: 0; height: 100%; border-radius: 2px; }
.dbar .pos { left: 50%; background: var(--gold); } .dbar .neg { right: 50%; background: var(--loss); }
.big { text-align: right; font-weight: 700; font-size: 17px; }
.big small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.big.pos { color: var(--gold); } .big.neg { color: var(--loss); }
@media (max-width: 640px) {
  ol.board button { grid-template-columns: 22px 1fr 78px; }
  ol.board .notes { grid-column: 2 / 4; grid-row: 2; }
  ol.board .dbar { grid-column: 2 / 4; grid-row: 3; }
}

/* Bars (HTML) */
.bars { display: grid; gap: 8px; }
/* Analytics sections (23 Nov 2026) */
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.segb { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 16px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
.segb.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-strong); font-weight: 600; }
/* a picked channel's sessions (23 Nov 2026) */
.sesb { font: inherit; font-size: 12px; padding: 1px 6px; margin: 0 3px 3px 0; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--muted); cursor: pointer; white-space: nowrap; }
.sesb.on { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); font-weight: 600; }
.sesb:disabled { cursor: default; opacity: .55; }
.sesb .win, .sesb .loss { font-weight: 600; }
/* Settings tab and Best of 10 channel builder (26 Nov 2026 revamp): tabs with state, switches, changed-value highlight,
   chips for the summary, a filterable list and one sticky bar for what isn't sent yet */
.segb.small { font-size: 13px; padding: 4px 11px; }
.acctseg .segb { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; }
.acctseg .segb .sub { font-size: 12px; font-weight: 400; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--win); flex: none; }
.dot.off { background: var(--loss); }
.jump { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin: -4px 0 6px; font-size: 14px; }
section.block[id] { scroll-margin-top: 12px; }
td.chg { background: var(--gold-soft); box-shadow: inset 3px 0 0 var(--gold); }
input.switch { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--rule-strong); position: relative; cursor: pointer; vertical-align: -5px; margin: 0; transition: background .15s; }
input.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; }
input.switch:checked { background: var(--gold); }
input.switch:checked::after { left: 16px; }
input.switch:disabled { opacity: .5; cursor: not-allowed; }
input.switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.swl { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; margin: 0 5px 5px 0; border-radius: 12px; background: var(--chip); font-size: 13px; }
.chip.add { background: var(--gold-soft); color: var(--ink); font-weight: 600; }
.chip.never { background: var(--loss-soft); color: var(--loss); }
.chip button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 3px; opacity: .7; }
.chip button:hover { opacity: 1; }
.tool { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 10px; }
.tool input[type=search] { font: inherit; font-size: 14px; padding: 6px 10px; min-width: min(100%, 220px); border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface); color: var(--ink); }
table.b10t.lite .more { display: none; }
table.b10t td.acts { white-space: nowrap; }
table.b10t tr.in td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
table.b10t tr.never td { opacity: .55; }
table.b10t tr.never td:first-child { opacity: 1; box-shadow: inset 3px 0 0 var(--loss); }
.sesb.act { min-width: 74px; }
.badge.extra { background: #E3ECF7; color: #2D5C8E; }
.badge.extra.off { background: var(--chip); color: var(--muted); }
.chip.xtra { background: #E3ECF7; color: #2D5C8E; font-weight: 600; }
@media (prefers-color-scheme: dark) { .badge.extra, .chip.xtra { background: #1E2E42; color: #9DC1EA; } }
.sesb.never.on { background: var(--loss-soft); border-color: var(--loss); color: var(--loss); font-weight: 600; }
.btnp { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--gold); background: var(--gold); color: var(--surface); cursor: pointer; white-space: nowrap; }
.btns { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btnp:disabled, .btns:disabled { opacity: .45; cursor: default; }
.savebar { position: sticky; bottom: 8px; z-index: 5; margin-top: 18px; display: grid; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--surface); box-shadow: 0 4px 18px rgba(0, 0, 0, .12); }
.savebar.dirty { border-color: var(--gold); }
.savebar .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.savebar .what { flex: 1 1 260px; font-size: 14px; color: var(--muted); }
.savebar .what.dirty { color: var(--ink); font-weight: 600; }
.savebar .what.bad { color: var(--loss); font-weight: 600; }
.savebar:not(.dirty) { gap: 2px; padding: 6px 14px; box-shadow: none; }   /* nothing to send: a slim status line */
.savebar:not(.dirty) .btnp, .savebar:not(.dirty) .btns, .savebar:not(.dirty) .hint { display: none; }
.savebar:not(.dirty) .what { font-size: 13px; }
.savebar.dirty .row.clean { display: none; }
@media (max-width: 640px) {
  .savebar .row { flex-wrap: nowrap; }
  .savebar .what { flex: 1 1 auto; min-width: 0; font-size: 13px; }
  .savebar .hint .note { display: none; }
  .savebar .hint { justify-content: flex-end; }
  .btnp, .btns { padding: 6px 11px; font-size: 13px; }
}
.bars .row { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 76px; gap: 10px; align-items: center; font-size: 14px; }
.bars .lab { overflow-wrap: anywhere; } .bars .lab small { color: var(--muted); display: block; font-size: 12px; }
.bars .track { position: relative; height: 12px; background: var(--chip); border-radius: 3px; }
.bars .track.div::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--muted); opacity: .5; }
.bars .fill { position: absolute; top: 0; height: 100%; border-radius: 3px; background: var(--gold); }
.bars .fill.neg { background: var(--loss); }
.bars .val { text-align: right; font-weight: 600; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.chart { min-height: 40px; }
svg .grid { stroke: var(--rule); stroke-width: 1; }
svg .zero { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }

/* Tables */
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 13px; background: var(--surface); }
th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--ink); }
th[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--chip); }
td.wrap { white-space: normal; min-width: 220px; }
/* wide channel tables fit the window (23 Nov 2026, Arnold: "Can table fit in a window without having to scroll? Some
   columns have a very big space"): headers wrap onto two lines, tighter cells, channel names and notes wrap */
table.compact { font-size: 13px; }
table.compact th { white-space: normal; vertical-align: bottom; line-height: 1.2; }
table.compact th, table.compact td { padding: 7px 7px; }
table.compact td.wrap { min-width: 140px; }
table.compact th:first-child, table.compact td:first-child { width: 1%; }
table.compact .badge { margin-left: 4px; }
td.flag { color: var(--loss); font-size: 13px; }
/* Settings tab: a heading row per group */
.psettings tr.pgroup th { background: var(--chip); color: var(--ink); font-size: 14px; font-weight: 700; padding-top: 12px; }
.psettings tr.pgroup th .pnote { font-weight: 400; color: var(--muted); font-size: 13px; }
.psettings td:first-child { padding-left: 22px; }
.psettings.pgrid { table-layout: fixed; min-width: 920px; }
.psettings.pgrid td:first-child { padding-left: 11px; }
.psettings.pgrid td, .psettings.pgrid th { vertical-align: top; white-space: normal; }
.psettings.pgrid td.wrap { min-width: 0; font-size: 13px; }
.buy { color: var(--win); font-weight: 600; } .sell { color: var(--loss); font-weight: 600; }
.win { color: var(--win); } .loss { color: var(--loss); } .muted { color: var(--muted, #888); font-style: italic; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
select, input[type=search] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 6px; padding: 6px 10px; }
input[type=search] { min-width: 220px; }
input[type=date] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 8px; }
label.datef { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
button.action { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.action:hover { border-color: var(--gold); }
.back { margin-bottom: 10px; display: inline-block; }
/* Filter bar under the tabs (since 18 Nov 2026): one period, channels, side, result and strategy for every tab */
.fbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 14px 0 0; }
.fbar select.on, .fbar input.on, .fbar details.on > summary { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.fbar details { position: relative; }
.fbar summary { list-style: none; cursor: pointer; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong);
  border-radius: 6px; padding: 6px 28px 6px 10px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; position: relative; }
.fbar summary::-webkit-details-marker { display: none; }
.fbar summary::after { content: "▾"; position: absolute; right: 10px; top: 6px; color: var(--muted); }
.fbar .pick { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; width: min(340px, 92vw); max-height: min(420px, 60vh); overflow: auto;
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); padding: 8px; }
.fbar .pick.flip { left: auto; right: 0; }
.fbar .pick input[type=search] { width: 100%; min-width: 0; margin-bottom: 4px; }
.fbar .pick .pick-head { display: flex; justify-content: space-between; gap: 10px; padding: 4px 4px 6px; font-size: 13px; }
.fbar .pick label { display: flex; gap: 8px; align-items: center; padding: 5px 4px; font-size: 14px; cursor: pointer; border-radius: 4px; overflow-wrap: anywhere; }
.fbar .pick label:hover { background: var(--chip); }
.fsum { color: var(--muted); font-size: 13px; padding-top: 8px; max-width: 100ch; }
.fsum:empty { display: none; }
.fsum strong { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) {
  .fbar > select, .fbar > details, .fbar > label.datef { flex: 1 1 calc(50% - 10px); min-width: 0; }
  .fbar select, .fbar summary { width: 100%; max-width: none; }
  .fbar label.datef input { min-width: 0; width: 100%; }
}

/* Unlock screen (website) */
body.locked main > :not(#unlock):not(#loading) { display: none; }
#loading { max-width: 420px; margin: 14vh auto 0; }
#loading p { color: var(--muted); margin-top: 8px; }
#unlock { max-width: 420px; margin: 14vh auto 0; }
#unlock p { color: var(--muted); margin-top: 8px; }
#unlock input[type=password] { display: block; width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 6px; padding: 10px 12px; margin: 16px 0 12px; }
#unlock button[type=submit] { font-weight: 600; color: var(--surface); background: var(--gold); border: 0;
  border-radius: 6px; padding: 10px 18px; margin-top: 16px; cursor: pointer; }
#unlock .error { color: var(--loss); min-height: 1.5em; }
@media (prefers-reduced-motion: no-preference) { ol.board li button, nav.tabs button { transition: background .15s, color .15s; } }
</style>
</head>
<body class="locked">
<main>
  <div id="loading" hidden>
    <h1><span class="mark" aria-hidden="true"></span>Gold signal tracker</h1>
    <p>Opening the dashboard… this can take a few seconds on a phone.</p>
  </div>
  <form id="unlock" hidden>
    <h1><span class="mark" aria-hidden="true"></span>Gold signal tracker</h1>
    <p>Enter your password to open the dashboard.</p>
    <label for="pw" class="note">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="toggle"><input type="checkbox" id="remember"> Remember on this device</label>
    <br><button type="submit" id="open">Open dashboard</button>
    <p class="error" id="unlock-error" role="alert"></p>
  </form>
  <header class="top">
    <div>
      <h1><span class="mark" aria-hidden="true"></span>Gold signal tracker</h1>
      <p class="asof" id="asof"></p>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="bf"> Include backfill</label>
      <button class="link" id="older" hidden></button>

    </div>
  </header>
  <nav class="tabs" id="nav" aria-label="Dashboard sections"></nav>
  <div class="fbar" id="fbar" role="search" aria-label="Filters for every tab"></div>
  <p class="fsum" id="fsum" aria-live="polite"></p>
  <div class="view" id="view"></div>
</main>

<script>
(function () {
  "use strict";
  var DATA = { trades: [], legs: [] }, LEGS = [], SIGS = [], CLEGS = [], CSIGS = [], NOTE = "";
  var VIEWS = [["overview", "Overview"], ["channels", "Channels"], ["live", "Live"], ["consensus", "Consensus"], ["account", "Live account"], ["best3", "Sandbox"], ["analytics", "Analytics"], ["history", "History"], ["agents", "Agents"], ["settings", "Settings"]];
  var OUTCOMES = ["TP hit", "Stop loss", "Trailing stop", "Breakeven stop", "Closed by channel", "Timed out", "Open", "Waiting for entry", "Not filled", "Invalid"];

  // ---------- state in the address (#v=channels&c=…), so it survives the automatic refresh ----------
  function readState() {
    var p = new URLSearchParams(location.hash.slice(1));

             s: p.get("s") || "totalR", d: p.get("d") !== "0", ho: p.get("ho") || "",
             om: parseInt(p.get("om") || "0", 10) || 0, la: parseInt(p.get("la") || "0", 10) || 0, sv: p.get("sv") || (p.get("bv") === "1" ? "bandit" : ""), an: p.get("an") || "", atp: p.get("atp") || "",
             // the filter bar: period (fp, with ff/ft for chosen dates), channels (fc, one or more), side (fs), result (fr), strategy (fg)
             fp: p.get("fp") || "", ff: p.get("ff") || "", ft: p.get("ft") || "", fc: p.getAll("fc").filter(Boolean),
             fs: p.get("fs") || "", fr: p.get("fr") || "", fg: p.get("fg") || "",
             fss: p.get("fss") || "", aa: p.get("aa") || "", ast: p.get("ast") || "",   // session filter; Channel scorecard: top 50 or all (23 Nov 2026)
             fb: p.get("fb") || "",   // fb: only the signals a Best of 10 copied (26 Nov 2026)
             fl: p.get("fl") || "", fsty: p.get("fsty") || "", fac: p.get("fac") || "", fn: p.get("fn") || "" };   // the Channel finder's lookback, style, account, set size

    if (!st.fc.length && p.get("hc")) st.fc = [p.get("hc")];
    if (!st.fs && p.get("hs")) st.fs = p.get("hs");

    if (state.q) p.set("q", state.q);
    if (state.s !== "totalR") p.set("s", state.s);

    if (state.ho) p.set("ho", state.ho);
    if (state.fp) p.set("fp", state.fp);

    if (state.om) p.set("om", String(state.om));
    if (state.la) p.set("la", String(state.la));
    if (state.sv) p.set("sv", state.sv);
    if (state.an) p.set("an", state.an);
    if (state.atp) p.set("atp", state.atp);

  function when(iso) { return iso ? new Date(iso).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""; }
  function dateOnly(iso) { return iso ? new Date(iso).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" }) : ""; }
  function timeOnly(iso) { return iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""; }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function ymd(iso) { if (!iso) return ""; var d = new Date(iso); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }

  function sum(a) { return a.reduce(function (s, x) { return s + (x || 0); }, 0); }
  // Best of 3's mid-week pause (since 17 Nov 2026): a paused channel's signals aren't copied but are tracked as if they

  function pauseNotes(log, week) {   // {channel: "paused 17 Nov 21:15 (48% of 25); back ..."} for the week (its Monday)
    var out = {};
    (log || []).forEach(function (e) {
      if (week && e.week !== week) return;
      var t = (e.event === "back" ? "back " : "paused ") + when(e.at) + (e.win == null ? "" : " (" + Math.round(e.win * 100) + "% of " + e.n + ")");
      out[e.grp] = out[e.grp] ? out[e.grp] + "; " + t : t;

  }
  function pausedSummary(rows, money) {   // "6 positions tracked, closed ones would have made +12.40 USD"
    var p = rows.filter(function (x) { return x.status === "Paused"; }), c = p.filter(function (x) { return x.would != null; });
    if (!p.length) return "";

  }
  function median(a) { if (!a.length) return null; var b = a.slice().sort(function (x, y) { return x - y; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }
  function byExit(a, b) { return (a.exit_at || "") < (b.exit_at || "") ? -1 : (a.exit_at || "") > (b.exit_at || "") ? 1 : 0; }
  function cls(x) { return x > 0 ? "pos" : x < 0 ? "neg" : ""; }
  function empty(text) { return el("p", { cls: "empty", text: text }); }
  // sections fold open and shut with the arrow by their title; the choice is remembered on this device
  var FOLD = (function () { try { return JSON.parse(localStorage.getItem("gst_fold") || "{}") || {}; } catch (e) { return {}; } })();
  function saveFold() { try { localStorage.setItem("gst_fold", JSON.stringify(FOLD)); } catch (e) {} }
  function setFold(sec, folded) {
    var b = sec.querySelector(".fold"), k = b && b.getAttribute("data-key");
    sec.classList.toggle("folded", folded);
    if (b) b.setAttribute("aria-expanded", folded ? "false" : "true");
    if (k) { if (folded) FOLD[k] = 1; else delete FOLD[k]; }
  }
  function block(title, note, body, extra) {
    var key = state.v + "|" + title, sec;
    var btn = el("button", { cls: "fold", type: "button", "data-key": key, "aria-expanded": FOLD[key] ? "false" : "true",
      on: { click: function () {
        var folding = !sec.classList.contains("folded");
        setFold(sec, folding); saveFold();

      } } }, [el("span", { cls: "arrow", "aria-hidden": "true", text: "▾" }), title]);
    sec = el("section", { cls: "block" + (FOLD[key] ? " folded" : "") },
      [el("div", { cls: "block-head" }, [el("h2", null, [btn]), note ? el("p", { cls: "note", text: note }) : null, extra || null]), body]);
    return sec;
  }
  function sideCell(t) { return el("span", { cls: t.side, text: t.side === "buy" ? "Buy" : "Sell" }); }
  function rCell(r) { return r == null ? "" : el("span", { cls: r > 0 ? "win" : r < 0 ? "loss" : "", text: signed(r, 2) }); }
  function outcomeGroup(t) {
    if (t.status === "closed") return { tp: "TP hit", sl: "Stop loss", breakeven: "Breakeven stop", manual: "Closed by channel", timeout: "Timed out", trail: "Trailing stop" }[t.exit_reason] || "Closed";
    if (t.status === "open") return "Open";
    if (t.status === "pending") return "Waiting for entry";
    if (t.status === "not_filled") return "Not filled";
    return "Invalid";
  }

  // ---------- data ----------
  function rawPool() { return LEGS.filter(function (t) { return state.bf || t.source !== "backfill"; }); }   // no filters (the tabs' counts)
  function pool(o) {   // the channels' positions that pass the filter bar (o.anyChannel: every channel, for one channel's own page)
    var k = "p" + (o && o.anyChannel ? 1 : 0);
    return MEMO[k] || (MEMO[k] = LEGS.filter(function (t) { return (state.bf || t.source !== "backfill") && legOK(t, o); }));
  }
  function sigPool(o) {
    var k = "s" + (o && o.anyChannel ? 1 : 0);
    return MEMO[k] || (MEMO[k] = SIGS.filter(function (t) { return (state.bf || t.source !== "backfill") && sigOK(t, o); }));
  }

  // ---------- filters (the bar under the tabs, since 18 Nov 2026): one period, channels, side, result and strategy for every tab ----------
  // A trade counts on the day its signal was posted or its order placed, in Nairobi time; a week starts Sunday 23:00 Nairobi,
  // like the tracker's week. The filters live in the address (#fp=week&fc=...), so they survive tab changes and refreshes.
  var NBO = 3 * 3600e3, DAY = 864e5, FX = null, MEMO = {}, CSUP = {}, CLEG_BY = {};
  var PERIODS = [["", "All dates"], ["today", "Today"], ["yday", "Yesterday"], ["week", "This week"], ["lweek", "Last week"],
    ["month", "This month"], ["lmonth", "Last month"], ["7d", "Last 7 days"], ["30d", "Last 30 days"], ["custom", "Choose dates…"]];
  var RESULTS = [["", "All results"], ["won", "Won"], ["lost", "Lost"], ["open", "Open or waiting"], ["none", "Not filled or not taken"]];
  function nbMidnight(t) { var d = new Date(t + NBO); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - NBO; }   // 00:00 Nairobi
  function nbYmd(t) { var d = new Date(t + NBO); return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate()); }
  function ymdMs(x) { var p = String(x || "").split("-"); return p.length === 3 && +p[0] ? Date.UTC(+p[0], +p[1] - 1, +p[2]) - NBO : null; }
  function nbDate(t) { return new Date(t).toLocaleDateString([], { day: "numeric", month: "short", timeZone: "Africa/Nairobi" }); }
  function weekStartMs(t) {   // Sunday 23:00 Nairobi on or before t
    var mid = nbMidnight(t + 3600e3), dow = (new Date(mid + NBO).getUTCDay() + 6) % 7;
    return mid - dow * DAY - 3600e3;
  }
  function periodRange(fp) {   // {from, to} in ms, to exclusive; null = open-ended
    var now = Date.now(), t0 = nbMidnight(now), f = null, t = null, d, m;
    switch (fp) {
      case "today": f = t0; t = t0 + DAY; break;
      case "yday": f = t0 - DAY; t = t0; break;
      case "week": f = weekStartMs(now); t = f + 7 * DAY; break;
      case "lweek": t = weekStartMs(now); f = t - 7 * DAY; break;
      case "month": case "lmonth":
        d = new Date(now + NBO); m = d.getUTCMonth() - (fp === "lmonth" ? 1 : 0);
        f = Date.UTC(d.getUTCFullYear(), m, 1) - NBO; t = Date.UTC(d.getUTCFullYear(), m + 1, 1) - NBO; break;
      case "7d": f = t0 - 6 * DAY; t = t0 + DAY; break;
      case "30d": f = t0 - 29 * DAY; t = t0 + DAY; break;

  }
  function fx() {   // this render's filters, worked out once
    if (FX) return FX;
    var r = periodRange(state.fp);
    FX = { from: r.from, to: r.to, chans: state.fc.length ? new Set(state.fc) : null, side: state.fs, res: state.fr, sess: SESS.indexOf(state.fss) >= 0 ? state.fss : "",
           b10: b10Sources().some(function (x) { return x[0] === state.fb; }) ? state.fb : "" };
    FX.period = FX.from != null || FX.to != null;
    FX.any = FX.period || !!FX.chans || !!FX.side || !!FX.res || !!FX.sess || !!FX.b10;
    return FX;
  }
  function tOf(o, k) { var c = "_t_" + k; if (!(c in o)) o[c] = o[k] ? Date.parse(o[k]) : null; return o[c]; }   // parsed once
  function inPeriod(t) { var f = fx(); return !f.period || (t != null && !isNaN(t) && (f.from == null || t >= f.from) && (f.to == null || t < f.to)); }
  function periodOverlaps(a, b) { var f = fx(); return !f.period || ((f.to == null || a < f.to) && (f.from == null || b > f.from)); }   // [a, b) touches it
  function chanOK(g) {
    var c = fx().chans;
    if (!c) return true;
    return Array.isArray(g) ? g.some(function (x) { return c.has(x); }) : c.has(g);
  }
  function sideOK(x) { var f = fx(); return !f.side || x === f.side; }
  // Best of 10 filter (26 Nov 2026, Arnold: "The analytics tab doesnt have a filter for Best of 10 (including stand ins) to
  // ease analysis"): only the channel signals a Best of 10 actually copied: the Sandbox's (its ranked channels and the
  // stand-ins that took a paused or muted one's place) or a live account's. Matched on the channel, the side and the time:
  // the signal that became complete nearest its order (1 min before to 5 min after). Signals it skipped (paused, chase,
  // no play left, removed at TP1) are left out. Its record on the page starts with the report's first trade.
  var B10_SKIPPED = { "Paused": 1, "Not copied": 1, "Removed": 1, "Skipped": 1 };
  function b10Sources() {   // [[key, label, trades]] for every Best of 10 with trades on the page
    var out = [];
    if (DATA.best10 && (DATA.best10.trades || []).length) out.push(["sb", "Best of 10, Sandbox (stand-ins included)", DATA.best10.trades]);
    liveAccounts().forEach(function (a) {
      var b = a.best10;
      if (b && (b.trades || []).length && a.section) out.push([a.section, "Best of 10, " + (a.label || a.section), b.trades]);
    });
    return out;
  }
  var B10IX = {};
  function b10Index(key) {   // {signal id: 1} of the channel signals that Best of 10 copied
    if (B10IX[key]) return B10IX[key];
    var src = b10Sources().filter(function (x) { return x[0] === key; })[0], ids = {}, by = {}, seen = {};
    SIGS.forEach(function (s) { if (s.status !== "superseded" && s.status !== "incomplete") (by[s.grp] = by[s.grp] || []).push(s); });
    ((src && src[2]) || []).forEach(function (x) {   // one row per TP: each order once
      if (!x.grp || B10_SKIPPED[x.status] || seen[x.grp + "|" + x.at]) return;
      seen[x.grp + "|" + x.at] = 1;
      var t = Date.parse(x.at), best = null, bd = 0;
      if (isNaN(t)) return;

        if (x.side && s.side && s.side !== x.side) return;
        var ts = tOf(s, s.complete_at ? "complete_at" : "posted_at"), dt = t - ts;
        if (ts == null || isNaN(ts) || dt < -60e3 || dt > 300e3) return;
        var dist = Math.abs(dt - 30e3);   // orders usually go in within a few seconds to a minute
        if (best == null || dist < bd) { best = s; bd = dist; }

      if (best) ids[best.id] = 1;
    });

    return ids;
  }
  function b10From(key) {   // when that Best of 10's record on the page starts (ms)
    var src = b10Sources().filter(function (x) { return x[0] === key; })[0], m = null;
    ((src && src[2]) || []).forEach(function (x) { var t = Date.parse(x.at); if (!isNaN(t) && (m == null || t < m)) m = t; });
    return m;
  }
  function b10OK(t) { var key = fx().b10; return !key || !!b10Index(key)[t.trade_id || t.id]; }
  // trading sessions (23 Nov 2026, Arnold: "In the analysis tab, we can have a filter for session and buys/sells"): London
  // time, as the tracker and the picks' session limits (Asia 22-07, London 07-12, London + New York 12-17, New York 17-22);
  // a signal's session is when the channel posted it (an order's: when it was placed)
  function lastSunUTC(y, m) { var d = new Date(Date.UTC(y, m + 1, 0)); return Date.UTC(y, m, d.getUTCDate() - d.getUTCDay(), 1); }
  function londonHour(ms) { var d = new Date(ms), y = d.getUTCFullYear(); return (d.getUTCHours() + (ms >= lastSunUTC(y, 2) && ms < lastSunUTC(y, 9) ? 1 : 0)) % 24; }
  function sessionOfMs(ms) { if (ms == null || isNaN(ms)) return null; var h = londonHour(ms); return h >= 22 || h < 7 ? "Asia" : h < 12 ? "London" : h < 17 ? "London + New York" : "New York"; }

  function resOK(r) { var f = fx(); return !f.res || r === f.res; }
  function legResult(t) {   // won, lost, open (or waiting), none (not filled or not traded); "" for the rest

    if (t.status === "open" || t.status === "pending") return "open";
    return t.status === "not_filled" || t.status === "invalid" ? "none" : "";
  }
  function orderResult(x) {   // MT5 orders and the strategies' rows
    var st = x.status || "";
    if (/^(Open|Pending|Waiting|Closing)$/.test(st)) return "open";
    if (/^(Paused|Cancelled|Skipped|Failed|Removed|Not copied|Expired)$/.test(st)) return "none";
    if (x.profit != null) return x.profit > 0 ? "won" : x.profit < 0 ? "lost" : "";
    return st === "Win" ? "won" : st === "Loss" ? "lost" : "";
  }
  function supporters(id) {   // the channels behind a consensus ("0_..."; its ladder "1_..." and its MT5 orders carry the same number)
    var m = /^\d+_(.+)$/.exec(String(id || ""));
    return (m && CSUP["0_" + m[1]]) || [];
  }
  function orderKind(x) {   // consensus, ladder or own, from an MT5 order's id and type
    var id = String(x.consensus_id || ""), k = x.kind || "";
    if (/^2_/.test(id) || /^Own /.test(k)) return "own";
    return /^1_/.test(id) || /^Ladder/.test(k) ? "ladder" : "consensus";
  }
  function stratFilter() {   // the Strategy filter where it applies (Consensus and Live account tabs; the Sandbox picks with sv)
    var g = state.fg;
    if (state.v === "consensus") return g === "consensus" || g === "ladder" ? g : "";
    if (state.v === "account") return ["consensus", "ladder", "best10", "best3", "own"].indexOf(g) >= 0 ? g : "";
    return "";
  }
  function stratOK(kind) { var g = stratFilter(); return !g || g === kind; }
  function legOK(t, o) { return inPeriod(tOf(t, "posted_at")) && ((o && o.anyChannel) || chanOK(t.grp)) && sideOK(t.side) && sessOK(t) && resOK(legResult(t)) && b10OK(t); }
  function sigOK(t, o) { return inPeriod(tOf(t, "posted_at")) && ((o && o.anyChannel) || chanOK(t.grp)) && sideOK(t.side) && sessOK(t) && b10OK(t); }
  function cLegOK(t) {   // a consensus or ladder position: its channels are the ones that agreed
    return inPeriod(tOf(t, "posted_at")) && chanOK(supporters(t.trade_id || t.id)) && sideOK(t.side) && sessOK(t) && resOK(legResult(t)) &&

  function orderOK(x, kind, grp) { return inPeriod(tOf(x, "at")) && chanOK(grp) && sideOK(x.side) && sessOK(x, "at") && resOK(orderResult(x)) && (!kind || stratOK(kind)); }

  }
